<!DOCTYPE html>
<html lang="sl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#f5f7fb">
    <link rel="apple-touch-icon" href="icon.png">
<link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>CarTrack</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            background: #f5f7fb;
            color: #172033;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", Arial, sans-serif;
            -webkit-font-smoothing: antialiased;
        }
        .app {
            width: min(100%, 430px);
            min-height: 100vh;
            margin: 0 auto;
            padding: calc(18px + env(safe-area-inset-top)) 18px calc(28px + env(safe-area-inset-bottom));
        }
        .topbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 22px; }
        .title { font-size: 30px; font-weight: 750; letter-spacing: -1px; }
        .gear { width: 42px; height: 42px; border: 0; border-radius: 14px; background: #fff; font-size: 21px; box-shadow: 0 3px 14px rgba(24,32,51,.07); }
        .debt-card { background: #dff7e8; border-radius: 24px; padding: 22px; text-align: center; margin-bottom: 12px; box-shadow: 0 6px 20px rgba(39,174,96,.08); }
        .label { font-size: 14px; color: #536074; font-weight: 600; }
        .debt { margin-top: 5px; font-size: 42px; line-height: 1; font-weight: 800; letter-spacing: -1.5px; }
        .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 14px; }
        .stat { background: #fff; border-radius: 20px; padding: 18px 14px; box-shadow: 0 4px 16px rgba(24,32,51,.06); }
        .stat-value { margin-top: 5px; font-size: 25px; font-weight: 750; letter-spacing: -.5px; }
        .km .stat-value { color: #1677ff; }
        .fuel .stat-value { color: #3d4657; }
        .action { width: 100%; border: 0; border-radius: 18px; padding: 17px 18px; margin-top: 10px; font-size: 17px; font-weight: 700; color: white; box-shadow: 0 6px 16px rgba(0,0,0,.08); }
        .blue { background: #1677ff; }
        .green { background: #20b86b; }
        .purple { background: #7567e8; }
        .action small { display: block; margin-top: 2px; font-size: 12px; font-weight: 500; opacity: .85; }
        .nav { display: grid; grid-template-columns: repeat(3,1fr); gap: 6px; margin-top: 26px; padding: 8px 4px; background: rgba(255,255,255,.8); border-radius: 20px; box-shadow: 0 4px 16px rgba(24,32,51,.06); }
        .nav button { border: 0; background: transparent; padding: 10px 4px; color: #727b8c; font-weight: 600; font-size: 12px; border-radius: 14px; }
        .nav button.active { color: #1677ff; background: #edf5ff; }
        .nav-icon { display: block; font-size: 19px; margin-bottom: 3px; }
        .hidden { display: none !important; }
        .page-title { font-size: 28px; font-weight: 800; margin: 6px 0 18px; letter-spacing: -0.8px; }
        .history-empty { background: #fff; border-radius: 20px; padding: 24px 18px; text-align: center; color: #727b8c; box-shadow: 0 4px 16px rgba(24,32,51,.06); }
        .history-item { background: #fff; border-radius: 18px; padding: 15px; margin-bottom: 8px; box-shadow: 0 4px 16px rgba(24,32,51,.05); display: flex; justify-content: space-between; gap: 12px; }
        .history-main { min-width: 0; }
        .history-name { font-weight: 750; }
        .history-details { margin-top: 4px; font-size: 12px; color: #727b8c; line-height: 1.45; }
        .history-amount { font-weight: 800; white-space: nowrap; }
        .history-amount.payment { color: #7567e8; }
        .history-amount.refuel { color: #20b86b; }
        .settings-card { background: #fff; border-radius: 20px; padding: 18px; box-shadow: 0 4px 16px rgba(24,32,51,.06); margin-bottom: 12px; }
        .settings-value { margin-top: 6px; font-size: 25px; font-weight: 800; }
        .settings-button { width: 100%; border: 0; border-radius: 18px; padding: 16px; background: #fff0f0; color: #d64545; font-size: 16px; font-weight: 750; }
        @media (min-width: 700px) { body { padding: 30px 0; } .app { min-height: auto; border-radius: 30px; box-shadow: 0 10px 50px rgba(24,32,51,.12); } }
    </style>
</head>
<body>
    <main class="app">
        <header class="topbar">
            <div class="title">CarTrack</div>
            <button class="gear" aria-label="Nastavitve">⚙️</button>
        </header>

        <section class="screen" id="home-screen">
            <section class="debt-card">
                <div class="label">Trenutni dolg</div>
                <div class="debt">0,00 €</div>
            </section>

            <section class="stats">
                <div class="stat km">
                    <div class="label">Neplačani km</div>
                    <div class="stat-value">0 km</div>
                </div>
                <div class="stat fuel">
                    <div class="label">Poraba (zadnji tank)</div>
                    <div class="stat-value">0,0 L/100 km</div>
                </div>
            </section>

            <button class="action blue">＋ &nbsp;Dodaj km</button>
            <button class="action green">⛽ &nbsp;Nov tank</button>
            <button class="action purple">💳 &nbsp;Plačaj vse<small>ponastavi števec</small></button>
        </section>

        <section class="screen hidden" id="history-screen">
            <div class="page-title">Zgodovina</div>
            <div id="history-list"></div>
        </section>

        <section class="screen hidden" id="settings-screen">
            <div class="page-title">Nastavitve</div>
            <div class="settings-card">
                <div class="label">Trenutna cena goriva</div>
                <div class="settings-value" id="settings-fuel-price">0,00 €/L</div>
            </div>
            <button class="settings-button" id="reset-data">Ponastavi vse podatke</button>
        </section>

        <nav class="nav">
            <button class="active"><span class="nav-icon">⌂</span>Domov</button>
            <button><span class="nav-icon">☷</span>Zgodovina</button>
            <button><span class="nav-icon">⚙</span>Nastavitve</button>
        </nav>
    </main>
    <script src="app.js"></script>
</body>
</html>
